image: gcc:13

stages:
  - check
  - dist
  - coverage
  - static-analysis
  - deploy

before_script:
  - apt-get update -qq
  - apt-get install -qq clang-tools curl docutils-common gdb lcov libarchive-dev libtalloc-dev strace swig uthash-dev xsltproc

check:
  stage: check
  script:
    - make -C src uvroot care
    - timeout --signal=SIGKILL 5m make -C test || true # ignore failing tests (for now)

dist:
  stage: dist
  script:
    - LDFLAGS="${LDFLAGS} -static" make -C src uvroot GIT=false
  after_script:
    - mkdir -p dist
    - cp src/uvroot dist/
    - cd dist
    - sha256sum ./uvroot > uvroot.sha256sum
    - md5sum ./uvroot > uvroot.md5sum
  artifacts:
    paths:
      - dist

gcov:
  stage: coverage
  script:
    - /bin/sh ./util/coverage.sh
  artifacts:
    paths:
      - gcov-latest

scan-build:
  stage: static-analysis
  script:
    - scan-build make -C src uvroot
  after_script:
    - cp -R /tmp/scan-build-* scan-build-latest
  artifacts:
    paths:
      - scan-build-latest

pages:
  stage: deploy
  script:
    - /bin/sh ./util/dist.sh
  dependencies:
    - dist
    - gcov
    - scan-build
  artifacts:
    paths:
      - public

site:
  stage: deploy
  script:
    - /bin/sh ./util/site.sh
  only:
    - master
  allow_failure: true
